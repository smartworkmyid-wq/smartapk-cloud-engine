# v3.0_DEEP_SYNC
name: SmartAPK Instant Cloud Builder
on:
  push:
    paths:
      - 'payload.json'
  workflow_dispatch:
concurrency:
  group: smartapk-builder
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compile-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Unpack Android Project
        run: echo "" | base64 -d | python3
      - name: Compile Signed APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Aplikasi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish Signed APK to Dist
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/output.apk
          git config user.name 'SmartAPK AutoBuilder'
          git config user.email 'autobuilder@smartwork.my.id'
          git add -f dist/output.apk dist/status.json
          git commit -m 'Publish Signed APK [skip ci]' || true
          git pull --rebase -X ours origin main || git pull --rebase -X ours origin master || true
          git push --force origin HEAD:main || git push --force origin HEAD:master || git push --force