# v4.0_DUAL_APK_EXE
name: SmartAPK and EXE Dual Cloud Builder
on:
  push:
    paths:
      - 'payload.json'
  workflow_dispatch:
concurrency:
  group: smartapk-builder
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compile-apk-and-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Unpack Project Payload
        run: echo "" | base64 -d | python3
      - name: Compile Standalone Windows EXE
        run: |
          if ! command -v mcs >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y mono-mcs
          fi
          mcs -target:winexe -out:dist/output.exe -win32icon:win_exe/app.ico -resource:app/src/main/assets/index.html,index.html win_exe/Program.cs
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Compile Signed Android APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK and EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Paket-Aplikasi-APK-dan-EXE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/output.exe
      - name: Publish Signed APK and EXE to Dist
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/output.apk
          git config user.name 'SmartAPK AutoBuilder'
          git config user.email 'autobuilder@smartwork.my.id'
          git add -f dist/output.apk dist/output.exe dist/status.json
          git commit -m 'Publish Signed APK and EXE [skip ci]' || true
          git pull --rebase -X ours origin main || git pull --rebase -X ours origin master || true
          git push --force origin HEAD:main || git push --force origin HEAD:master || git push --force