name: SmartAPK Instant Cloud Builder
on:
  push:
    paths:
      - 'payload.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Unpack Android Project
        run: python3 -c "import json,base64,os; [ (os.makedirs(os.path.dirname(k),exist_ok=True) if os.path.dirname(k) else None, open(k,'wb').write(base64.b64decode(v))) for k,v in json.load(open('payload.json'))['files'].items() ]"
      - name: Compile Signed APK
        run: gradle assembleDebug --no-daemon
      - name: Publish Signed APK to Dist
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/output.apk
          python3 -c "import json; d=json.load(open('payload.json')); json.dump({'buildId': d['buildId'], 'status': 'ready'}, open('dist/status.json', 'w'))"
          git config user.name 'SmartAPK AutoBuilder'
          git config user.email 'autobuilder@smartwork.my.id'
          git add dist/output.apk dist/status.json
          git commit -m 'Publish Signed APK [skip ci]' || true
          git push